name: Agent Vigil

on:
  # This template is valid only when committed at the default-branch commit W
  # of the isolated proof mirror. GitHub must select these W-owned bytes.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  evidence:
    name: Mirror exact-head candidate proof
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.base.ref == 'recovery-base' &&
      github.event.pull_request.head.ref == 'recovery-head-f2c7412' &&
      github.event.pull_request.head.sha == 'f2c74127367c67f3f38f86df64209d3a5bf3034a'
    runs-on: ubuntu-24.04
    steps:
      - name: Select the exact hosted Node.js release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - id: identity
        name: Bind the default-selected workflow, PR body, and exact tuple
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_PATH: ${{ github.event_path }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          [[ "$EVENT_NAME" == "pull_request_target" ]]
          [[ "$EVENT_REPOSITORY" == "sulmusic2-star/agent-vigil-governance-recovery-20260827" ]]
          [[ "$EVENT_BASE_REF" == "recovery-base" ]]
          [[ "$EVENT_HEAD_REF" == "recovery-head-f2c7412" ]]
          [[ "$EVENT_HEAD_SHA" == "f2c74127367c67f3f38f86df64209d3a5bf3034a" ]]
          [[ "$EVENT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_BASE_SHA" ]]
          [[ -f "$EVENT_PATH" && ! -L "$EVENT_PATH" ]]
          pr_author=$(/usr/bin/jq -er '.pull_request.user.login | select(type=="string" and test("^[A-Za-z0-9-]+$"))' "$EVENT_PATH")
          [[ "$pr_author" == "sulmusic2-star" ]]
          pr_body=$(/usr/bin/jq -er '.pull_request.body // "" | select(type=="string")' "$EVENT_PATH")
          body_digest=$(/usr/bin/printf '%s' "$pr_body" | /usr/bin/sha256sum | { read -r value _; printf '%s' "$value"; })
          [[ "$body_digest" =~ ^[0-9a-f]{64}$ ]]
          echo "pr_author=$pr_author" >> "$GITHUB_OUTPUT"
          echo "pr_body_hash=sha256:$body_digest" >> "$GITHUB_OUTPUT"

      - name: Check out the exact candidate without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - id: vigil
        name: Exercise the exact fixed runtime in the candidate-only contract
        uses: sulmusic2-star/agent-vigil@311cb7dc5379fe37fd83e5c73748cc88e6ee4e8f
        with:
          mode: maintainer
          policy: .agent-vigil.json
          policy-ref: ${{ github.event.pull_request.base.sha }}
          repo: .
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          isolate-candidate: true
          candidate-setup-cmd: npm ci --ignore-scripts

      - id: binding
        name: Assert PASS and retain the exact proof binding
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROOF_PR_NUMBER: ${{ github.event.pull_request.number }}
          PROOF_PR_AUTHOR: ${{ steps.identity.outputs.pr_author }}
          PROOF_PR_BODY_HASH: ${{ steps.identity.outputs.pr_body_hash }}
          PROOF_STATUS: ${{ steps.vigil.outputs.status }}
          PROOF_RECEIPT_HASH: ${{ steps.vigil.outputs['receipt-hash'] }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          [[ "$PROOF_STATUS" == "PASS" ]]
          [[ "$PROOF_RECEIPT_HASH" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EVENT_HEAD_SHA" == "f2c74127367c67f3f38f86df64209d3a5bf3034a" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_BASE_SHA" ]]
          [[ "$PROOF_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$PROOF_PR_AUTHOR" == "sulmusic2-star" ]]
          [[ "$PROOF_PR_BODY_HASH" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WORKFLOW_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$WORKFLOW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

          binding="$RUNNER_TEMP/agent-vigil-mirror-recovery-binding.json"
          checksum="$RUNNER_TEMP/agent-vigil-mirror-recovery-binding.sha256"
          umask 077
          /usr/bin/printf '%s\n' \
            '{' \
            '  "schemaVersion": 1,' \
            '  "kind": "agent-vigil-mirror-governance-recovery",' \
            '  "repository": "sulmusic2-star/agent-vigil-governance-recovery-20260827",' \
            "  \"proofPullRequest\": $PROOF_PR_NUMBER," \
            "  \"proofPullRequestAuthor\": \"$PROOF_PR_AUTHOR\"," \
            "  \"proofPullRequestBodyHash\": \"$PROOF_PR_BODY_HASH\"," \
            "  \"workflowRunId\": $WORKFLOW_RUN_ID," \
            "  \"workflowRunAttempt\": $WORKFLOW_RUN_ATTEMPT," \
            "  \"workflowSha\": \"$WORKFLOW_SHA\"," \
            "  \"baseSha\": \"$EVENT_BASE_SHA\"," \
            "  \"headSha\": \"$EVENT_HEAD_SHA\"," \
            '  "runtimeRepository": "sulmusic2-star/agent-vigil",' \
            '  "runtimeSha": "311cb7dc5379fe37fd83e5c73748cc88e6ee4e8f",' \
            "  \"status\": \"$PROOF_STATUS\"," \
            "  \"receiptHash\": \"$PROOF_RECEIPT_HASH\"" \
            '}' > "$binding"
          digest=$(/usr/bin/sha256sum "$binding" | { read -r value _; printf '%s' "$value"; })
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          /usr/bin/printf '%s  %s\n' "$digest" 'agent-vigil-mirror-recovery-binding.json' > "$checksum"
          echo "binding=$binding" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Upload the exact proof binding
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-vigil-mirror-recovery-f2c74127367c67f3f38f86df64209d3a5bf3034a
          path: |
            ${{ steps.binding.outputs.binding }}
            ${{ steps.binding.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30
